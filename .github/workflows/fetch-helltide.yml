name: Fetch Helltide Data

on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:

permissions:
  contents: write

# Scheduled runs can overlap if one is slow, and two jobs pushing to main race
# each other. Queue them instead.
concurrency:
  group: fetch-helltide
  cancel-in-progress: false

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Fetch and compute all data
        run: node scripts/fetch-data.js

      - name: Commit if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/helltide.json
          if git diff --cached --quiet; then
            echo "No change to commit."
            exit 0
          fi
          git commit -m "chore: update helltide data"
          git pull --rebase --autostash origin main
          git push
